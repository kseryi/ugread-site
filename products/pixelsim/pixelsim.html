"uk"?"PixelSim • STEM-освіта для українських шкіл":"PixelSim • STEM Education Curriculum"}),s.jsx("button",{id:"btn-handbook-confirm-close",onClick:U,className:"px-4 py-2 rounded-xl bg-gradient-to-r from-purple-700 to-indigo-700 hover:from-purple-600 hover:to-indigo-600 text-white font-semibold text-xs transition-all shadow-md active:scale-95",children:o.helpClose})]})]})}):null}const ym={uk:{title:"Підручник: Оптика ока, патології рефракції та дальтонізм",subtitle:"Посібник зі шкільного курсу біології та фізики: як світло заломлюється в оці, чому виникають порушення зору та як їх виправляють лінзи",badge:"Офтальмологія & Оптика",categories:[{id:"all",label:"Усі розділи"},{id:"optics",label:"Оптика ока"},{id:"myopia",label:"Близорукість"},{id:"hyperopia",label:"Далекозорість"},{id:"astigmatism",label:"Астигматизм"},{id:"colorblind",label:"Дальтонізм"},{id:"ishihara",label:"Таблиці Ішіхари"},{id:"hygiene",label:"Гігієна зору"}],sections:[{id:"optics",category:"optics",title:"1. Оптична система людського ока: як будується зображення",summary:"Фізика заломлення світла: рогівка, кришталик, акомодація та формула тонкої лінзи.",content:`Око людини за своєю фізичною будовою нагадує надскладний живий фотоапарат:
• Рогівка (Cornea) — прозора зовнішня передня лінза ока. Вона забезпечує приблизно 40–43 діоптрії оптичної сили (понад 70% усього заломлення світла в оці!).
• Зіниця (Pupil) — природна регульована діафрагма в центрі райдужки, яка розширюється в темряві (до 7-8 мм) і звужується на яскравому сонці (до 2 мм).
• Кришталик (Lens) — жива двоопукла еластична лінза з оптичною силою від 19 до 33 діоптрій. Завдяки крихітному війковому (циліарному) м'язу кришталик здатний змінювати свою кривизну — цей процес називається акомодацією. Коли ми дивимося вдалину, м'яз розслаблений, а кришталик сплощений. Коли ми підносимо книгу близько до очей, м'яз напружується, кришталик стає більш опуклим і сильніше заломлює промені.
• Сітківка (Retina) — «матриця» фотоапарата. Саме сюди кришталик має спроєктувати зменшене, перевернуте, але ідеально чітке дійсне зображення навколишнього світу.

Загальна оптична сила спокійного ока становить близько 58–60 діоптрій при довжині очного яблука приблизно 24 мм. Стан, коли промені від далеких предметів у розслабленому оці фокусуються точно на сітківці, в офтальмології називається Еметропією (нормальний зір).`},{id:"myopia",category:"myopia",title:"2. Близорукість (Короткозорість / Міопія): причини та корекція",summary:"Подовжене очне яблуко, фокус перед сітківкою та чому потрібні розсіювальні (мінусові) лінзи.",content:`Близорукість (міопія) — найпоширеніше порушення зору серед школярів і студентів у світі:
Чому це відбувається:
1. Анатомічна (осьова) причина: очне яблуко видовжується вздовж оптичної осі (його довжина стає більшою за нормальні 24 мм). Навіть подовження всього на 1 міліметр призводить до міопії у -3.0 діоптрії!
2. Оптична (рефракційна) причина: рогівка або кришталик мають надто сильну заломлюючу здатність.

Що бачить людина з міопією:
Паралельні світлові промені від далеких об'єктів (шкільна дошка, вивіски на вулиці) заломлюються надто сильно і сходяться у фокус ПЕРЕД сітківкою. До самої сітківки промені доходять уже розбіжними, утворюючи на ній не чітку точку, а розмите коло світлорозсіювання. Людина чітко бачить текст на смартфоні поблизу, але далечінь розпливається в тумані.

Як допомагають окуляри:
Для корекції міопії застосовують розсіювальні (увігнуті, мінусові) сферичні лінзи. Увігнута лінза розводить промені світла перед тим, як вони потраплять в око. Завдяки цьому остаточна точка фокусування відсувається назад — рівно на площину сітківки! Зір миттєво стає 100% (Visus 1.0).

Ступені міопії:
• Слабка: до -3.0 D;
• Середня: від -3.25 D до -6.0 D;
• Висока: понад -6.0 D (може супроводжуватися розтягненням сітківки).`},{id:"hyperopia",category:"hyperopia",title:"3. Далекозорість (Гіперметропія) та пресбіопія: оптика плюс-лінз",summary:"Вкорочене очне яблуко, фокус за сітківкою та збиральні (плюсові) лінзи.",content:`Далекозорість (гіперметропія) — стан рефракції, протилежний до короткозорості:
Чому це відбувається:
1. Очне яблуко занадто коротке (менше за 23–24 мм) або оптична сила рогівки чи кришталика недостатня.
2. Промені світла після заломлення спрямовані в уявну фокальну точку, яка лежить ЗА межами очного яблука (позаду сітківки).

Що відчуває людина:
При легкій гіперметропії молоді люди за рахунок постійного напруження війкового м'яза (акомодації) можуть примусово робити кришталик опуклішим і тривалий час компенсувати дефект. Проте це викликає хронічну втому очей, сльозотечу, різь і головний біль (астенопію). При погляді на дрібний шрифт поблизу сил акомодації вже не вистачає — літери розпливаються.

Як допомагають окуляри:
Для корекції гіперметропії використовують збиральні (опуклі, плюсові) сферичні лінзи. Опукла лінза попередньо зводить світловий пучок, додаючи необхідні діоптрійні сили (наприклад +2.0 D). У результаті сумарний фокус переміщується вперед — точно на рецептори сітківки.

Що таке пресбіопія (вікова далекозорість):
Після 40–45 років білкова речовина кришталика природно ущільнюється і втрачає еластичність. Війковий м'яз уже не може змінити його форму для фокусування поблизу. Це природний фізіологічний процес, який вимагає окремих окулярів для читання («плюсових»).`},{id:"astigmatism",category:"astigmatism",title:"4. Астигматизм: торична деформація рогівки та подвоєння ліній",summary:"Чому виникає двоїння контурів, що таке коноїд Штурма та як працюють циліндричні лінзи.",content:`Слово «астигматизм» походить від грецького «а» (заперечення) та «stigma» (точка) — тобто нездатність оптичної системи сформувати точку:
Чому це відбувається:
В ідеальному оці рогівка має сферичну форму (як ідеальний м'яч для футболу) — її кривизна однакова в усіх напрямках.
При астигматизмі рогівка (або рідше кришталик) викривлена асиметрично і нагадує м'яч для регбі або поверхню дині.
• В одному меридіані (наприклад, вертикальному 90°) кривизна крутіша і заломлює світло сильніше;
• У перпендикулярному меридіані (горизонтальному 180°) кривизна більш полога і заломлює слабше.

Світло утворює не єдиний фокус, а дві взаємно перпендикулярні фокальні лінії на різній глибині ока (фокалоїд / коноїд Штурма).

Що бачить людина з астигматизмом:
• Лінії на моніторі або в зошиті здаються розмитими в одному напрямку (наприклад, вертикальні палички літери «Н» чіткі, а горизонтальна розмита або двоїться);
• Круглі ліхтарі та фари машин вночі розтягуються в еліпси чи зірки з довгими променями;
• Очі швидко втомлюються, з'являється характерний примружений погляд, яким пацієнт намагається звузити апертуру ока.

Як коригують астигматизм:
Звичайні сферичні лінзи тут безсилі, оскільки вони однаково змінюють оптичну силу в усіх напрямках.
Використовують спеціальні циліндричні (торичні) лінзи (Cylinder, Cyl). Циліндрична лінза має оптичну дію лише в одній площині й не змінює промені в іншій. Її налаштовують під точним кутом осі (Axis від 0° до 180°), завдяки чому обидва меридіани ока вирівнюються в єдиний ідеальний фокус!`},{id:"colorblind",category:"colorblind",title:"5. Дальтонізм: генетика, типи дихромазії та відсутність колбочок",summary:"Зчеплення з X-хромосомою (чому 8% чоловіків проти 0.5% жінок), дейтеранопія, протанопія та тританопія.",content:`Дальтонізм (порушення колірного зору) названий на честь видатного англійського хіміка і фізика Джона Дальтона, який сам страждав на цю недугу і вперше науково описав її у 1794 році, зрозумівши, що бачить троянди не червоними, а попелясто-блакитними!

Генетичний механізм:
У нашій сітківці за колір відповідають три типи колбочок:
• L-колбочки (пігмент еритролаб, ген OPN1LW) — червоний колір;
• M-колбочки (пігмент хлоролаб, ген OPN1MW) — зелений колір;
• S-колбочки (пігмент ціанолаб, ген OPN1SW) — синій колір.

Гени червоного та зеленого пігментів розташовані поруч на статевій жіночій X-хромосомі.
• У чоловіків набір хромосом XY: якщо їхня єдина X-хромосома містить дефектний або відсутній ген колбочки, у хлопця обов'язково виникне дальтонізм! Тому серед чоловіків близько 8% (кожен 12-й!) мають дальтонізм тієї чи іншої форми.
• У жінок набір хромосом XX: якщо одна X-хромосома пошкоджена, друга здорова компенсує її. Жінка стає безсимптомним носієм гена. Дальтонізм у жінок виникає лише якщо ОДНОЧАСНО обидві X-хромосоми мають дефект (це становить лише близько 0.4–0.5% жінок, 1 на 200–250).

Основні клінічні форми дальтонізму:
1. Дейтеранопія (зелена сліпота, ~6% чоловіків):
Відсутні або функціонально неактивні M-колбочки. Зелений та червоний спектри змішуються в один брудно-жовтуватий відтінок. Найпоширеніший тип у світі!
2. Протанопія (червона сліпота, ~2% чоловіків):
Відсутні L-колбочки. Червоний колір сприймається дуже тьмяним, темно-коричневим, брудно-сірим або взагалі чорним.
3. Тританопія (синя сліпота, вкрай рідкісна, ~0.005%):
Мутація в 7-й автосомі (не зчеплена зі статтю). Відсутні S-колбочки. Плутають синій із зеленим, а жовтий бачать як блідо-рожевий чи світло-фіолетовий.
4. Акроматопсія (Монохромазія):
Повна відсутність усіх трьох типів колбочок. Людина бачить світ виключно у відтінках сірого (як чорно-біле фото), спираючись лише на палички. Супроводжується світлобоязню.`},{id:"ishihara",category:"ishihara",title:"6. Таблиці Ішіхари та поліхроматичні тести: як ставлять діагноз",summary:"Як кольорові плями виявляють дефіцит фоторецепторів та чому водіям і пілотам перевіряють зір.",content:`У 1917 році японський військовий лікар-офтальмолог Сінобу Ішіхара (Shinobu Ishihara) створив серію дивовижних тестових таблиць, які й досі залишаються золотим стандартом діагностики колірного зору в усьому світі:

Як влаштована таблиця Ішіхари:
Таблиця складається з сотень круглих цяток різного діаметра, що мають дещо різну яскравість і випадкове розташування.
Плями двох відтінків (наприклад, помаранчево-коричневі та смарагдово-зелені) утворюють цифру або фігуру:
• Людина з нормальним трихроматичним зором миттєво групує плями за кольоровим спектром і без зусиль читає приховану цифру (наприклад, «74»).
• Пацієнт із дейтеранопією або протанопією не розрізняє червонуваті та зеленуваті тони — для нього ці плями мають однакову колірну тональність! Натомість яскравість цяток заплутує його, і він або бачить зовсім іншу цифру (наприклад, «21»), або взагалі не бачить жодної цифри на суцільному фоні!

Контрольні таблиці (наприклад, пластина з цифрою «12»):
У кожному наборі є обов'язкова контрольна таблиця, яку бачать абсолютно всі — навіть люди з повною сліпотою на кольори. Вона потрібна для того, щоб виключити симуляцію або проблеми з загальною гостротою зору.

Де обов'язковий тест на дальтонізм:
• Отримання водійського посвідчення (розрізнення сигналів світлофора, дорожніх знаків та стоп-сигналів автомобілів);
• Авіація та флот (пілоти, штурмани, авіадиспетчери повинні безпомилково бачити посадкові вогні та навігаційні маркери);
• Електротехніка та ІТ (колірне маркування дротів кабелів Ethernet, резисторів, фазних проводів 220В);
• Дизайн та поліграфія.`},{id:"hygiene",category:"hygiene",title:"7. Гігієна зору та захист очей під час онлайн-навчання",summary:"Правило 20-20-20, ергономіка робочого місця школяра та профілактика втоми очей.",content:`Дистанційне навчання та тривала робота за ноутбуком створюють колосальне навантаження на війковий м'яз очей. Ось ключові золоті правила для збереження зору:

1. Золоте правило «20-20-20»:
Кожні 20 хвилин безперервної роботи за монітором зробіть 20-секундну перерву та подивіться на предмет, розташований на відстані щонайменше 20 футів (приблизно 6 метрів — наприклад, у вікно на дерево чи хмаринку). Це миттєво розслабляє війковий м'яз кришталика і запобігає спазму акомодації!

2. Контролюйте моргання:
Коли ми уважно читаємо з екрана чи граємо у гру, частота моргання знижується в 2–3 рази (з нормальних 15–20 разів на хвилину до 5–7 разів). Слізна плівка висихає, виникає синдром «сухого ока» та почервоніння. Свідомо моргайте частіше або робіть легкі заплющування очей на кілька секунд.

3. Правильна дистанція та кут:
Відстань від очей до екрана монітора повинна дорівнювати довжині вашої витягнутої руки (50–70 см). Верхній край монітора повинен бути на рівні очей або на 10–15° нижче, щоб погляд був спрямований дещо зверху вниз — це зменшує відкриту площу очної щілини та захищає слізну плівку від випаровування.

4. Рівномірне освітлення кімнати:
Ніколи не сидіть перед яскравим монітором у повній темряві! Контраст між чорною кімнатою та яскравим білим дисплеєм викликає швидку втому зіниці, яка постійно намагається змінити діаметр. Використовуйте м'яке фонове освітлення кімнати або настільну лампу з розсіяним світлом.`}]},en:{title:"Handbook: Eye Optics, Refractive Errors & Color Blindness",subtitle:"Comprehensive STEM guide on eye biology and geometric optics: light refraction, myopia, hyperopia, astigmatism, and Ishihara tests",badge:"Ophthalmology & Optics",categories:[{id:"all",label:"All Chapters"},{id:"optics",label:"Eye Optics"},{id:"myopia",label:"Myopia"},{id:"hyperopia",label:"Hyperopia"},{id:"astigmatism",label:"Astigmatism"},{id:"colorblind",label:"Color Blindness"},{id:"ishihara",label:"Ishihara Test"},{id:"hygiene",label:"Eye Hygiene"}],sections:[{id:"optics",category:"optics",title:"1. Human Eye Optical System: Image Formation",summary:"Refraction physics: cornea, crystalline lens accommodation, and the thin lens equation.",content:`The human eye operates physically like a high-precision biological camera:
• Cornea: The clear outer window providing ~40–43 diopters of optical power (over 70% of total light refraction).
• Pupil: The iris aperture adjusting from 2 mm in daylight to 7–8 mm in dim conditions.
• Crystalline Lens: An elastic biconvex lens (19–33 D). The ciliary muscle relaxes for distant vision and contracts to steepen curvature for close reading (accommodation).
• Retina: The biological sensor array receiving a real, inverted, miniature image.

Normal unaccommodated eye focus lands precisely on the fovea centralis of the retina — known as Emmetropia.`},{id:"myopia",category:"myopia",title:"2. Nearsightedness (Myopia): Mechanism & Diverging Lenses",summary:"Elongated axial length, focus in front of the retina, corrected by concave (minus) lenses.",content:`Myopia occurs when:
1. The eyeball is too long (axial myopia, >24 mm). Every 1 mm of elongation corresponds to roughly -3.0 D of myopia!
2. The cornea or lens refractive power is excessively strong.

Visual effect:
Parallel rays from distant scenes converge to a focal point in front of the retina, dispersing into a blur circle by the time they reach photoreceptors. Near objects remain sharp.

Correction:
Concave (diverging, negative) lenses spread incoming light rays outward before entering the eye, shifting the focal point back onto the retina.`},{id:"hyperopia",category:"hyperopia",title:"3. Farsightedness (Hyperopia) & Presbyopia: Convex Lenses",summary:"Shortened eyeball, virtual focus behind retina, corrected by convex (plus) lenses.",content:`Hyperopia is the opposite refractive defect:
• The eye is too short (<23 mm) or refractive power is too weak.
• Rays focus toward an imaginary point behind the retina.
• Near reading requires heavy ciliary muscle accommodation, triggering eye strain and headaches.

Correction:
Convex (converging, positive) lenses converge rays prior to entering the eye, bringing the sharp focal point forward onto the retina.

Presbyopia:
Age-related hardening of the crystalline lens after age 40 reduces accommodation elasticity, requiring reading glasses.`},{id:"astigmatism",category:"astigmatism",title:"4. Astigmatism: Toroidal Cornea & Cylindrical Lenses",summary:"Asymmetric corneal curvature, Sturm's conoid, and directional axis correction.",content:`Instead of a spherical football curve, an astigmatic cornea resembles an American football or rugby ball:
• Steeper meridian (e.g. 90°) refracts light more strongly;
• Flatter perpendicular meridian (e.g. 180°) refracts light more weakly;
• Light produces two separate focal lines instead of a single point (Sturm's conoid).

Visual symptoms:
Distorted text lines, shadow halos around letters and night streetlights, eye fatigue.

Correction:
Toric cylindrical lenses (Cyl) with specific angle orientation (Axis 0°–180°) that refract exclusively along one meridian to equalize both planes.`},{id:"colorblind",category:"colorblind",title:"5. Color Vision Deficiency: Genetics & Photopigments",summary:"X-linked inheritance (~8% men vs ~0.5% women), deuteranopia, protanopia, and tritanopia.",content:`Discovered by chemist John Dalton in 1794:
Genetics:
Genes for red (OPN1LW) and green (OPN1MW) photopigments reside on the X chromosome.
• Men (XY): A single defective X chromosome causes color deficiency (~8% of males).
• Women (XX): Both X chromosomes must harbor the mutation for expression (~0.4–0.5% of females).

Classifications:
1. Deuteranopia / Deuteranomaly: Defective or absent M (green) cones. Green and red blend into brownish-yellow hues.
2. Protanopia / Protanomaly: Defective or absent L (red) cones. Red appears dark brown or near-black.
3. Tritanopia: Rare defect in S (blue) cones on chromosome 7.
4. Achromatopsia: Complete absence of all functional cones; vision is mediated exclusively by rods (monochrome grayscale).`},{id:"ishihara",category:"ishihara",title:"6. Ishihara Pseudoisochromatic Plates & Diagnostics",summary:"How colored dot mosaics detect cone deficiencies in aviation, driving, and medicine.",content:`Designed in 1917 by Dr. Shinobu Ishihara:
Dots of varying sizes and luminance form patterns:
• Normal trichromats instantly discern numbers (e.g. "74") by hue boundaries;
• People with red-green deficiencies cannot isolate the chromatic boundary and see either "21" or no figure;
• Control plates (like "12") are visible to all observers to verify basic visual comprehension and prevent malingering.`},{id:"hygiene",category:"hygiene",title:"7. Digital Ergonomics & Vision Protection",summary:"The 20-20-20 rule, ambient lighting balance, and preventing asthenopia during screen study.",content:`Key habits for remote learning:
1. The 20-20-20 rule: Every 20 minutes, look at an object 20 feet away for 20 seconds.
2. Deliberate blinking: Screen focus drops blink rate from 18/min down to 6/min.
3. Proper distance: Keep the monitor at an arm's length (50–70 cm) with the top bezel slightly below eye level.
4. Ambient lighting: Never work in a pitch-black room with high monitor brightness.`}]}};function Cm({isOpen:d,onClose:U,lang:N}){const[o,R]=P.useState(""),[w,v]=P.useState("all"),D=ym[N]||ym.uk,ee=P.useMemo(()=>D.sections.filter(C=>{const E=C.title.toLowerCase().includes(o.toLowerCase())||C.content.toLowerCase().includes(o.toLowerCase())||C.summary.toLowerCase().includes(o.toLowerCase()),b=w==="all"||C.category===w;return E&&b}),[D.sections,o,w]);return d?s.jsx("div",{className:"fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-black/85 backdrop-blur-md animate-in fade-in duration-200",onClick:C=>{C.target===C.currentTarget&&U()},children:s.jsxs("div",{id:"disorders-handbook-modal",className:"bg-[#0c1024] border border-[#273468] rounded-3xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden shadow-purple-950/70",children:[s.jsxs("div",{className:"flex items-center justify-between px-5 py-4 border-b border-[#212c58] bg-gradient-to-r from-[#141b3c] via-[#1a1c48] to-[#121634]",children:[s.jsxs("div",{className:"flex items-center gap-3",children:[s.jsx("div",{className:"w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-400 via-purple-500 to-violet-900 flex items-center justify-center text-white shadow-lg shadow-purple-900/50 border border-purple-300/40 shrink-0",children:s.jsx(mn,{className:"w-5 h-5"})}),s.jsxs("div",{children:[s.jsxs("div",{className:"flex items-center gap-2",children:[s.jsx("h2",{className:"text-base sm:text-lg font-bold text-white leading-tight",children:D.title}),s.jsx("span",{className:"text-[10px] font-mono uppercase bg-indigo-950/90 text-indigo-300 px-2 py-0.5 rounded-full border border-indigo-500/40 hidden sm:inline",children:D.badge})]}),s.jsx("p",{className:"text-xs text-purple-300/80 line-clamp-1",children:D.subtitle})]})]}),s.jsx("button",{id:"btn-close-disorders-handbook",onClick:U,className:"p-2 rounded-xl bg-[#1d244c] hover:bg-[#28346e] text-slate-300 hover:text-white transition-all active:scale-95 b На екрані вашого комп'ютера, смартфона чи планшета будь-яка картинка розбита на крихітну мозаїку з мільйонів пікселів. Наприклад, роздільна здатність Full HD означає, що по горизонталі розміщено 1920 точок, а по вертикалі — 1080 точок (загалом понад 2 мільйони пікселів!).

Найдивовижніше те, що сам піксель не є неподільною краплею фарби. Якщо подивитися на нього в потужний мікроскоп (або через нашу віртуальну лупу), ми побачимо, що кожен піксель фізично складається з трьох окремих мікро-випромінювачів — субпікселів:
• Червоний (Red, R);
• Зелений (Green, G);
• Синій (Blue, B).

Жодного іншого світла екран фізично не створює!`},{id:"additive",title:"2. Адитивний синтез RGB проти фарб CMYK у малюванні",content:`Усі діти в школі на уроках малювання знають: якщо змішати червону, жовту і синю фарби або фломастери — вийде брудно-коричнева або майже чорна калюжа. Чому ж на екрані комп'ютера змішування червоного, зеленого та синього кольорів дає ідеальний чистий БІЛИЙ колір?

Секрет криється у двох принципово різних фізичних процесах:

1. Субтрактивний синтез (віднімання світла — фарби, принтери CMYK):
Фарби не випромінюють власного світла. Вони лише поглинають (віднімають) частину сонячного спектра і відбивають решту. Чим більше фарб ви змішуєте на папері, тим більше світла поглинається, і тим темнішою стає суміш (поки не стане чорною).

2. Адитивний синтез (додавання світла — монітори, ліхтарі, RGB):
Екран монітора є джерелом світла. Субпікселі самі випромінюють фотони прямо у ваші зіниці. Коли у темній кімнаті світяться всі три субпікселі з максимальною яскравістю (R:255, G:255, B:255), їхні світлові потоки сумуються. Сума всіх трьох первинних променів спектра сприймається оком як денне сонячне біле світло!`},{id:"yellow-paradox",title:"3. Нейробіологічний фокус: звідки на екрані береться жовтий колір?",content:`Уважно подивіться на жовтий колір у нашому симуляторі. Спробуйте ввімкнути пресет «Жовтий» або задати повзунками R: 255, G: 255, B: 0.

Тепер погляньте у блок лупи посередині. Що ви бачите?
Ви бачите червоні та зелені субпікселі, що горять на 100%! Синій субпіксель повністю вимкнений. Але де ж жовтий? Його фізично немає на екрані! На моніторах взагалі немає жовтих діодів!

Як же ми бачимо жовтий лимон чи сонечко у відеоіграх?
• Червоне світло (довжина хвилі ~650 нм) потрапляє в око і збуджує L-колбочки.
• Зелене світло (довжина хвилі ~530 нм) одночасно потрапляє в око і збуджує M-колбочки.
• Сині S-колбочки залишаються спокійними.

Коли зоровий нерв передає у мозок одночасний сигнал від L- і M-колбочок однакової сили, мозок звіряється зі своєю еволюційною картою пам'яті й каже: «Така комбінація сигналів у природі буває тоді, коли в око світить сонячне жовте світло з довжиною хвилі 580 нм. Отже, це ЖОВТИЙ колір!».
Таким чином, жовтий колір на всіх екранах планети — це чистий нейробіологічний обман мозку!`},{id:"retina",title:"4. Будова сітківки: колбочки проти паличок («трубочок»)",content:`Сітківка — це тонка світлочутлива оболонка на очному дні, товщиною менше ніж 0,5 мм, але в ній міститься понад 130 мільйонів фоторецепторних клітин двох типів:

1. Колбочки (близько 6–7 мільйонів):
• Розташовані здебільшого в центральній ямці сітківки (жовтій плямі, fovea centralis), куди потрапляє прямий фокус зору.
• Відповідають за високу чіткість і розрізнення дрібних деталей.
• Працюють лише при яскравому освітленні (денний або фотопічний зір).
• Поділяються на 3 типи:
  — L-колбочки (Long-wavelength, чутливі до довгохвильового червоно-помаранчевого світла, пік ~560 нм, містять пігмент еритролаб);
  — M-колбочки (Medium-wavelength, чутливі до зеленого світла, пік ~530 нм, містять пігмент хлоролаб);
  — S-колбочки (Short-wavelength, чутливі до короткохвильового синього світла, пік ~420 нм, містять пігмент ціанолаб).

2. Палички (часто діти на уроках називають їх «трубочками», близько 120 мільйонів):
• Розташовані по всій периферії сітківки.
• Містять надчутливий світловий пігмент — родопсин (зоровий пурпур).
• У сотні разів чутливіші за колбочки: здатні зреагувати навіть на один-єдиний фотон світла!
• Відповідають за сутінковий і нічний зір (скотопічний зір), а також бічний зір і рух.
• Але палички мають лише один тип пігменту і НЕ розрізняють кольорів! Саме тому в сутінках або вночі людське око бачить світ чорно-сірим («вночі всі коти сірі»).`},{id:"brain-vision",title:"5. Як мозок обробляє сигнали: зорова кора V1 і V4 та колір Маджента",content:`Коли фотони світла збуджують родопсин у паличках або фотопсин у колбочках, виникає електрохімічний нервовий імпульс. Через біполярні та гангліозні клітини сітківки сигнал біжить по зоровому нерву до перехрестя (зорової хіазми), потім у підкірковий центр зору — таламус (латеральне колінчасте тіло), а звідти — прямо в потиличну частку мозку!

У корі головного мозку розташовані спеціалізовані аналізатори:
• Первинна зорова кора V1: розпізнає контраст, контури та базові лінії.
• Зона V4: саме тут формується усвідомлене сприйняття кольору та сталість кольорового сприйняття (color constancy).

Парадокс Мадженти (пурпуру):
У сонячному спектрі (веселці) є послідовність: Червоний -> Помаранчевий -> Жовтий -> Зелений -> Блакитний -> Синій -> Фіолетовий.
Жодної «мадженти» у фізичному спектрі немає!
Але якщо увімкнути Червоний (R:255) та Синій (B:255) субпікселі без зеленого, збуджуються одночасно найдовші (L) та найкоротші (S) рецептори. Мозок розуміє, що це не зелений колір (бо M-колбочки мовчать), і замикає лінійний фізичний спектр у психологічне коло кольорів, синтезуючи мадженту — колір, створений виключно уявою нашого мозку!`},{id:"fusion",title:"6. Оптичне злиття: чому ми не бачимо пікселів щодня?",content:`Людське око — це оптична система з кришталиком, яка має фундаментальну фізичну межу роздільної здатності. Вона становить приблизно 1 кутову мінуту (1/60 градуса).

Коли ви сидите на нормальній відстані від монітора (близько 50–70 см):
• Кутовий розмір окремого субпікселя на Full HD чи 4K моніторі стає меншим за 1 кутову мінуту.
• Промені від червоної, зеленої та синьої смужок пікселя заломлюються кришталиком і фокусуються на один і той самий мікроскопічний кластер колбочок сітківки.
• Фізично в оці відбувається дифракційне та просторове розмиття.
• Мозок просто не в змозі просторово відокремити смужку від смужки й бачить єдиний рівномірний колір.

У нашому симуляторі ви можете порухати повзунок «Відстань очей від монітора» і на власні очі побачити, як при віддаленні окремі геометричні субпікселі плавно зливаються в єдиний монолітний відтінок!`},{id:"matrices",title:"7. Різниця технологій матриць: LCD проти OLED та CRT",content:`За історію розвитку дисплеїв інженери винайшли кілька принципово різних способів розміщення та запалювання субпікселів:

1. LCD (Рідкокристалічні дисплеї — IPS, VA, TN):
Мають позаду потужне біле світлодіодне підсвічування (LED Backlight). Перед ним стоїть шар рідких кристалів, що працюють як мікроскопічні віконні жалюзі, відкриваючи або перекриваючи потік світла. Попереду знаходяться червоний, зелений та синій світлофільтри у вигляді вертикальних смужок.

2. OLED (Органічні світлодіоди, AMOLED):
Тут підсвічування взагалі немає! Кожен субпіксель — це крихітний органічний напівпровідник, який світиться сам, коли через нього тече струм. Чорний колір на OLED ідеальний, бо піксель просто вимикається.
Сучасні OLED-екрани (Samsung AMOLED, iPhone) використовують структуру Diamond PenTile:
• Червоні та сині субпікселі виконані у вигляді ромбів (повернутих на 45° квадратів);
• Сині ромби більші за площею, тому що синій органічний люмінофор зношується швидше і потребує більшої площі;
• Між ними хрестоподібно розташовані компактні круглі зелені діоди (їх удвічі більше, адже око людини найчутливіше до зеленого).

3. CRT (Електронно-променеві кінескопи):
Старі телевізори та монітори з великою вакуумною трубкою. Три електронні гармати вистрілювали пучками електронів у скляний екран, покритий люмінофорними круглими точками-тріадами (червона, зелена, синя), що світилися під час удару електронів.`},{id:"eye-hygiene",title:"8. Гігієна зору під час дистанційного навчання в Україні",content:`Під час дистанційного навчання учні та вчителі проводять перед моніторами багато годин щодня. Щоб зберегти зір гострим і здоровим, дотримуйтесь важливих науково обґрунтованих порад:

1. Правило «20–20–20»:
Кожні 20 хвилин роботи за комп'ютером робіть перерву на 20 секунд і дивіться вдалечінь на відстань 20 футів (близько 6 метрів — наприклад, у вікно на дерево чи небо). Це дозволяє циліарному м'язу кришталика ока повністю розслабитися.

2. Кліпайте частіше:
Коли ми дивимось на екран, частота кліпання зменшується в 2–3 рази! Рогівка пересихає, виникає синдром «сухого ока» та відчуття піску. Свідомо кліпайте під час уроку або використовуйте зволожувальні краплі за порадою лікаря.

3. Не вчіться у повній темряві:
Різкий контраст між яскравим монітором і абсолютно темною кімнатою перевтомлює зіниці та сітківку. Завжди вмикайте м'яке фонове освітлення в кімнаті.

4. Синє світло перед сном:
Короткохвильові сині фотони (близько 450–480 нм) потрапляють на спеціальні світлочутливі клітини сітківки (ipRGC), що подають команду мозку припинити вироблення гормону сну — мелатоніну. Тому за 1–2 години до сну вмикайте на пристроях режим «Нічне світло» (Night Shift / фільтр синього) або читайте звичайну паперову книгу.`}]},en:{stemCategory:"STEM Education • Physics & Biology",appTitle:"PixelSim",appSubtitle:"Monitor Display, RGB Subpixel & Color Perception Simulator",handbookBtn:"Handbook",downloadHtmlBtn:"Offline HTML",downloadHtmlTooltip:"Download simulator as a standalone single HTML file for offline use without internet on PC or any web server",eyeDrawerBtn:"Eye Vision",disordersBtn:"Vision Disorders",disordersTabName:"2. Eye Disorders & Color Blindness",pixelsTabName:"1. RGB Pixel Synthesis",disordersHandbookBtn:"Handbook: Eye Disorders",monitorTitle:"1. Computer Monitor",magnifierTitle:"2. Magnifying Lens",magnifierSubtitle:"Microscopic structure of physical subpixels",intensityTitle:"3. Subpixel Intensities",intensitySubtitle:"RGB channel brightness & color mixing control",eyeBiologyTitle:"Human Eye Perception",eyeBiologySubtitle:"Retina cones L/M/S, rods, and visual cortex",presetTitle:"Educational Experiments (Presets):",selectImage:"Select monitor artwork:",imgNebula:"Cosmic Nebula",imgGeometric:"Geometric Prisms",imgWaves:"Cyberpunk Waves",imgCircle:"Color Circle",imgSolid:"Solid Color",pixelMode:"Matrix structure:",matrixLcd:"LCD Stripes",matrixOled:"OLED Diamond PenTile",matrixCrt:"CRT Triad",zoomLabel:"Magnification:",distanceLabel:"Viewing Distance (Optical Fusion):",distClose:"Macro close-up (visible subpixels)",distFar:"Far away (seamless color)",distCm:"cm",dragHint:"💡 Tap or drag the lens across the monitor screen to sample color",subpixelRed:"Red (R)",subpixelGreen:"Green (G)",subpixelBlue:"Blue (B)",brightness:"bri.",coneL:"L-cones (Red spectrum, ~560 nm)",coneM:"M-cones (Green spectrum, ~530 nm)",coneS:"S-cones (Blue spectrum, ~420 nm)",rodsLabel:'Rods ("Tubes") — night vision (rhodopsin)',excitation:"excitation",helpClose:"Close",customColorPrompt:"Manual RGB Override:",sampledColor:"Sampled Color:",modeSample:"Artwork",modeManual:"Custom Color",handbookTitle:"Handbook: Display Physics, Subpixels & Color Vision Biology",handbookSubtitle:"Curriculum guide for remote STEM learning: how screens trick our visual cortex into perceiving millions of colors",footerText:"Interactive STEM simulation for distance learning: display optics, additive light mixing, and retinal biology.",tabMonitor:"Monitor",tabMagnifier:"Magnifier",tabSubpixels:"Subpixels",eyeDrawerHeading:"Biology of Vision: How Photons Turn into Color",eyeDrawerIntro:"All digital colors on display do not exist on the glass surface — they are synthesized inside your brain's visual cortex. Explore how your retina reacts in real time!",handbookSections:[{id:"pixels",title:"1. What is a Pixel and a Subpixel?",content:`The word "pixel" is a portmanteau of "picture element". Every screen — from smartphones to massive 4K TVs — forms an image out of millions of microscopic square pixels.

However, a pixel is not a single monochromatic dot. Under our high-power virtual magnifier, you will observe that each pixel physically consists of three distinct miniature emitters or color filters called subpixels:
• Red (R);
• Green (G);
• Blue (B).

No other colored light is physically generated by the display!`},{id:"additive",title:"2. Additive RGB Synthesis vs Subtractive Pigments (CMYK)",content:`In art class, mixing red, yellow, and blue paint creates a muddy dark brown. Why does mixing Red, Green, and Blue light on a monitor create brilliant, pure White?

1. Subtractive Mixing (Pigments / Painting / Printing CMYK):
Paints emit no light. They absorb (subtract) certain wavelengths from ambient sunlight. The more paint colors you blend, the more light is absorbed, until almost no light is reflected (yielding black).

2. Additive Light Mixing (Monitors / Projectors / RGB):
Displays emit photons directly into your eyes. When Red, Green, and Blue subpixels illuminate at 100% brightness simultaneously (R:255, G:255, B:255), their emitted photons add together in your eye, triggering all three cone photoreceptor types equally, which your visual cortex decodes as bright daylight White!`},{id:"yellow-paradox",title:"3. The Neural Paradox of Yellow on Screens",content:`Switch to the "Yellow" preset or drag the sliders to Red: 255, Green: 255, Blue: 0.

Now examine the magnifying lens in the middle. You will notice that ONLY red and green subpixels are illuminated! The blue subpixel is completely dark. There are NO yellow LEDs on modern computer monitors!

How do we perceive yellow?
• Red photons (~650 nm) excite your retina's L-cones.
• Green photons (~530 nm) simultaneously excite your M-cones.
• S-cones remain silent.

When your optic nerve sends equal stimulation from L- and M-cones to the brain, the visual cortex deduces: "This exact ratio occurs in nature when monochromatic 580 nm yellow sunlight strikes the retina." Thus, your brain invents the perception of yellow!`},{id:"retina",title:"4. Structure of the Retina: Cones vs Rods",content:`The human retina contains over 130 million photoreceptor cells classified into two primary categories:

1. Cones (~6–7 million cells):
• Concentrated in the fovea centralis for sharp, high-resolution central vision.
• Operate under bright daylight (photopic vision).
• Divided into three varieties:
  — L-cones (Long-wavelength red spectrum, ~560 nm peak, erythrolabe);
  — M-cones (Medium-wavelength green spectrum, ~530 nm peak, chlorolabe);
  — S-cones (Short-wavelength blue spectrum, ~420 nm peak, cyanolabe).

2. Rods ("Tubes", ~120 million cells):
• Distributed across the peripheral retina.
• Contain the photopigment rhodopsin, sensitive enough to trigger on a single photon!
• Responsible for scotopic (night/dusk) vision and motion detection.
• However, rods have only one photopigment and cannot differentiate hues. That is why at night, human vision is entirely monochromatic gray.`},{id:"brain-vision",title:"5. Brain Visual Pathways: Cortical Areas V1, V4 & Non-Spectral Magenta",content:`Retinal nerve signals travel through the optic nerve, cross at the optic chiasm, synapse in the thalamus (lateral geniculate nucleus), and arrive at the primary visual cortex (V1) and color-specialized area V4.

The Mystery of Magenta:
In the physical rainbow spectrum, colors progress from Red to Violet. There is no single electromagnetic wavelength for magenta.
When Red (R:255) and Blue (B:255) subpixels shine without green, the brain receives signals from opposite ends of the spectrum (L and S cones) with zero M-cone activity. Rather than seeing green, the brain loops the physical linear spectrum into a perceptual color circle and invents Magenta — an entirely brain-synthesized color!`},{id:"fusion",title:"6. Spatial Optical Fusion: Why Pixels Disappear with Distance",content:`The human eye is an optical system with an angular resolution limit of approximately 1 arcminute (1/60th of a degree).

At typical monitor distances (50–70 cm):
• The physical spacing between subpixels subtends an angle far smaller than 1 arcminute.
• Incoming photons from adjacent red, green, and blue stripes blur diffractionally across the very same photoreceptor receptive field.
• The brain cannot resolve the individual stripes and perceives a smooth, homogeneous color.

Use the "Viewing Distance" slider to simulate step-by-step how microscopic subpixels fuse into a uniform hue as your distance increases!`},{id:"matrices",title:"7. Matrix Architectures: LCD vs OLED Diamond PenTile vs CRT",content:`Over decades of display engineering, three major pixel layouts became dominant:

1. LCD (Liquid Crystal Display):
A bright white LED backlight passes through a layer of liquid crystals acting as light shutters, followed by vertical red, green, and blue color filters.

2. OLED (Organic Light Emitting Diodes):
Every subpixel is a microscopic self-emissive organic diode. True blacks are achieved by turning diodes off completely.
Modern smartphone and monitor OLEDs use the Diamond PenTile matrix:
• Red and blue subpixels are oriented as 45° diamonds;
• Blue diamonds are larger to prolong their operational lifespan;
• Compact round green dots form a dense diamond mesh between them, catering to the human eye's peak sensitivity to green light.

3. CRT (Cathode Ray Tubes):
Retro glass vacuum monitors where electron beams raster across triads of red, green, and blue phosphor dots.`},{id:"eye-hygiene",title:"8. Screen Ergonomics & Eye Health during Distance Learning",content:`With extensive remote schooling and screen time, protecting your vision is critical:

1. The 20-20-20 Rule:
Every 20 minutes, take a 20-second break and focus on an object at least 20 feet (6 meters) away (such as looking out the window). This relaxes the ciliary lens muscle.

2. Conscious Blinking:
Screen use drops natural blink rates by up to 60%, leading to digital eye strain and dry eyes. Remember to blink deliberately or use artificial tears.

3. Balanced Ambient Lighting:
Avoid using bright screens in total darkness. Use soft bias or ambient room lighting to minimize pupil strain.

4. Blue Light & Sleep:
High-energy blue light (~450 nm) triggers melanopsin-containing retinal ganglion cells that suppress the sleep hormone melatonin. Enable night mode or warm color temperature 1–2 hours before bedtime.`}]}};function zp(){const[d,U]=P.useState("uk"),N=Mp[d],[o,R]=P.useState("pixels"),[w,v]=P.useState(255),[D,ee]=P.useState(215),[C,E]=P.useState(0),[b,G]=P.useState("solid"),[k,re]=P.useState(0),[ae,le]=P.useState({x:45,y:40}),[je,oe]=P.useState(!1),[Ke,B]=P.useState(!1),[K,M]=P.useState(!1),[z,O]=P.useState(!1),[te,Y]=P.useState("all"),X=P.useMemo(()=>w===0&&D===0&&C===0?d==="uk"?"Чорний":"Black":w===255&&D===255&&C===255?d==="uk"?"Чистий Білий":"Pure White":w===D&&D===C?d==="uk"?"Відтінок сірого":"Grayscale Shade":w>200&&D>200&&C<60?d==="uk"?"Яскравий Жовтий":"Vibrant Yellow":w>200&&C>200&&D<70?d==="uk"?"Маджента (Пурпур)":"Magenta (Purple)":D>190&&C>190&&w<70?d==="uk"?"Ціан (Блакитний)":"Cyan (Aqua)":w>210&&D>90&&D<180&&C<60?d==="uk"?"Помаранчевий":"Orange":w>190&&D<80&&C<80?d==="uk"?"Червоний спектр":"Red Spectrum":D>190&&w<80&&C<80?d==="uk"?"Зелений спектр":"Green Spectrum":C>190&&w<80&&D<80?d==="uk"?"Синій спектр":"Blue Spectrum":w>140&&D>190&&C<80?d==="uk"?"Салатовий":"Lime Green":w>130&&D<80&&C>170?d==="uk"?"Фіолетовий":"Violet":d==="uk"?"Змішаний відтінок":"Mixed Hue",[w,D,C,d]),ge=(A,Q,$)=>{G("solid"),v(A),ee(Q),E($)},Ee=(A,Q,$)=>{v(A),ee(Q),E($)},Pe=()=>{G("solid"),v(255),ee(215),E(0),re(0),le({x:45,y:40})},Be=async()=>{try{const Q=await fetch("/pixelsim.html");if(Q.ok){const $=await Q.blob(),xe=URL.createObjectURL($),L=document.createElement("a");L.href=xe,L.download="pixelsim.html",document.body.appendChild(L),L.click(),document.body.removeChild(L),URL.revokeObjectURL(xe);return}}catch(Q){console.warn("Could not fetch standalone HTML via blob, opening directly",Q)}const A=document.createElement("a");A.href="/pixelsim.html",A.download="pixelsim.html",A.target="_blank",document.body.appendChild(A),A.click(),document.body.removeChild(A)};return s.jsxs("div",{cl
