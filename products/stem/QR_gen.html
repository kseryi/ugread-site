<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Generator PRO</title>

<style>
body {
    font-family: Arial;
    background:#111;
    display:flex;
    justify-content:center;
    padding:30px;
}

.container {
    width:500px;
    background:#fff;
    padding:20px;
    border-radius:15px;
}

h2 {
    text-align:center;
}

input, select {
    width:100%;
    box-sizing:border-box;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
    border:1px solid #ddd;
    font-size:14px;
}

button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#00aaff;
    color:white;
    font-size:14px;
}

button:hover {
    background:#0088cc;
}

#qr {
    margin-top:20px;
    display:flex;
    justify-content:center;
    padding:15px;
    background:#fff;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>PRO QR Generator</h2>

<select id="type" onchange="switchType()">
    <option value="text">Text / URL</option>
    <option value="wifi">Wi-Fi</option>
    <option value="email">Email</option>
    <option value="phone">Phone</option>
    <option value="vcard">vCard</option>
</select>

<div id="inputs"></div>

<button onclick="generateQR()">Generate QR</button>
<button onclick="downloadQR()">Download PNG</button>

<div id="qr"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

function switchType(){
    const type = document.getElementById("type").value;
    const box = document.getElementById("inputs");

    if(type === "text"){
        box.innerHTML = `<input id="data" placeholder="Текст або URL (укр підтримується)">`;
    }

    if(type === "wifi"){
        box.innerHTML = `
            <input id="ssid" placeholder="Назва WiFi">
            <input id="pass" placeholder="Пароль">
        `;
    }

    if(type === "email"){
        box.innerHTML = `
            <input id="email" placeholder="Email">
            <input id="subject" placeholder="Тема">
        `;
    }

    if(type === "phone"){
        box.innerHTML = `<input id="phone" placeholder="Номер телефону">`;
    }

    if(type === "vcard"){
        box.innerHTML = `
            <input id="name" placeholder="Ім'я (англійською)">
            <input id="phone" placeholder="Телефон">
            <input id="email" placeholder="Email">
        `;
    }
}

switchType();

function val(id){
    const el = document.getElementById(id);
    return el ? el.value.trim() : "";
}

function buildData(){
    const type = document.getElementById("type").value;

    if(type === "text"){
        return val("data");
    }

    if(type === "wifi"){
        return `WIFI:T:WPA;S:${val("ssid")};P:${val("pass")};;`;
    }

    if(type === "email"){
        const email = encodeURIComponent(val("email"));
        const subject = encodeURIComponent(val("subject"));
        return `mailto:${email}?subject=${subject}`;
    }

    if(type === "phone"){
        return `tel:${val("phone")}`;
    }

    if(type === "vcard"){
        const name = val("name");
        const phone = val("phone");
        const email = val("email");

        return [
            "BEGIN:VCARD",
            "VERSION:3.0",
            "CHARSET=UTF-8",
            "FN:" + name,
            "TEL:" + phone,
            "EMAIL:" + email,
            "END:VCARD"
        ].join("\r\n");
    }
}

function generateQR(){

    const text = buildData();

    const qrBox = document.getElementById("qr");
    qrBox.innerHTML = "";

    new QRCode(qrBox, {
        text: text,
        width: 256,
        height: 256,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });
}

function downloadQR(){
    const img = document.querySelector("#qr img");
    if(!img) return;

    const link = document.createElement("a");
    link.href = img.src;
    link.download = "qr.png";
    link.click();
}

</script>

</body>
</html>
