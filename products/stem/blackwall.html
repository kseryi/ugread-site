<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>AR Blueprint Scanner</title>

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#000;
    width:100%;
    height:100%;
}

#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

#overlay{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
}

#threeContainer{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
}

#status{
    position:fixed;
    top:10px;
    left:10px;
    z-index:10;
    background:rgba(0,0,0,.7);
    color:white;
    padding:8px;
    font-family:Arial;
    border-radius:8px;
}
</style>
</head>
<body>

<div id="status">Запуск...</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<div id="threeContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const statusDiv = document.getElementById("status");

let renderer;
let scene;
let camera3d;

let wallsGroup = new THREE.Group();

async function startCamera(){

    try{

        const stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:{
                    ideal:"environment"
                }
            },
            audio:false
        });

        video.srcObject = stream;

        await video.play();

        resize();

        initThree();

        requestAnimationFrame(processFrame);

        statusDiv.innerText="AR активний";

    }catch(err){

        console.error(err);
        alert("Не вдалося отримати доступ до камери");

    }
}

function resize(){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    if(renderer){
        renderer.setSize(window.innerWidth,window.innerHeight);
    }
}

window.addEventListener("resize",resize);

function initThree(){

    scene = new THREE.Scene();

    camera3d = new THREE.PerspectiveCamera(
        60,
        window.innerWidth/window.innerHeight,
        0.1,
        1000
    );

    camera3d.position.set(0,5,15);

    renderer = new THREE.WebGLRenderer({
        alpha:true,
        antialias:true
    });

    renderer.setSize(window.innerWidth,window.innerHeight);

    document
        .getElementById("threeContainer")
        .appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff,2);

    light.position.set(10,20,10);

    scene.add(light);

    scene.add(new THREE.AmbientLight(0xffffff,1));

    scene.add(wallsGroup);
}

function clear3D(){

    while(wallsGroup.children.length){

        wallsGroup.remove(wallsGroup.children[0]);

    }
}

function addWall(x,y,w,h){

    const geo = new THREE.BoxGeometry(
        w/20,
        3,
        0.2
    );

    const mat = new THREE.MeshStandardMaterial({
        color:0xdddddd
    });

    const wall = new THREE.Mesh(geo,mat);

    wall.position.set(
        (x-canvas.width/2)/40,
        1.5,
        -(y-canvas.height/2)/40
    );

    wallsGroup.add(wall);
}

function addWindow(x,y){

    const geo = new THREE.BoxGeometry(
        1,
        1,
        0.1
    );

    const mat = new THREE.MeshStandardMaterial({
        color:0x55aaff
    });

    const obj = new THREE.Mesh(geo,mat);

    obj.position.set(
        (x-canvas.width/2)/40,
        1.2,
        -(y-canvas.height/2)/40
    );

    wallsGroup.add(obj);
}

function addDoor(x,y){

    const geo = new THREE.BoxGeometry(
        0.9,
        2.1,
        0.1
    );

    const mat = new THREE.MeshStandardMaterial({
        color:0x884400
    });

    const obj = new THREE.Mesh(geo,mat);

    obj.position.set(
        (x-canvas.width/2)/40,
        1,
        -(y-canvas.height/2)/40
    );

    wallsGroup.add(obj);
}

function addOpening(x,y){

    const geo = new THREE.BoxGeometry(
        1,
        2.3,
        0.1
    );

    const mat = new THREE.MeshStandardMaterial({
        color:0x4444ff,
        transparent:true,
        opacity:0.35
    });

    const obj = new THREE.Mesh(geo,mat);

    obj.position.set(
        (x-canvas.width/2)/40,
        1.1,
        -(y-canvas.height/2)/40
    );

    wallsGroup.add(obj);
}

function processFrame(){

    if(typeof cv==="undefined"){

        requestAnimationFrame(processFrame);
        return;
    }

    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    let src = cv.imread(canvas);

    let hsv = new cv.Mat();

    cv.cvtColor(
        src,
        hsv,
        cv.COLOR_RGBA2RGB
    );

    cv.cvtColor(
        hsv,
        hsv,
        cv.COLOR_RGB2HSV
    );

    clear3D();

    detectBlack(src);
    detectRed(hsv);
    detectGreen(hsv);
    detectBlue(hsv);

    renderer.render(scene,camera3d);

    src.delete();
    hsv.delete();

    requestAnimationFrame(processFrame);
}

function detectBlack(src){

    let gray = new cv.Mat();

    cv.cvtColor(
        src,
        gray,
        cv.COLOR_RGBA2GRAY
    );

    let edges = new cv.Mat();

    cv.Canny(
        gray,
        edges,
        50,
        150
    );

    let lines = new cv.Mat();

    cv.HoughLinesP(
        edges,
        lines,
        1,
        Math.PI/180,
        50,
        50,
        10
    );

    for(let i=0;i<lines.rows;i++){

        const l=lines.data32S;

        const x1=l[i*4];
        const y1=l[i*4+1];
        const x2=l[i*4+2];
        const y2=l[i*4+3];

        addWall(
            (x1+x2)/2,
            (y1+y2)/2,
            Math.hypot(x2-x1,y2-y1),
            3
        );
    }

    gray.delete();
    edges.delete();
    lines.delete();
}

function detectColor(hsv,low,high,callback){

    let mask = new cv.Mat();

    let lowMat =
        new cv.Mat(
            hsv.rows,
            hsv.cols,
            hsv.type(),
            low
        );

    let highMat =
        new cv.Mat(
            hsv.rows,
            hsv.cols,
            hsv.type(),
            high
        );

    cv.inRange(
        hsv,
        lowMat,
        highMat,
        mask
    );

    let contours =
        new cv.MatVector();

    let hierarchy =
        new cv.Mat();

    cv.findContours(
        mask,
        contours,
        hierarchy,
        cv.RETR_EXTERNAL,
        cv.CHAIN_APPROX_SIMPLE
    );

    for(let i=0;i<contours.size();i++){

        let rect =
            cv.boundingRect(
                contours.get(i)
            );

        callback(
            rect.x+rect.width/2,
            rect.y+rect.height/2
        );
    }

    lowMat.delete();
    highMat.delete();
    mask.delete();
    contours.delete();
    hierarchy.delete();
}

function detectRed(hsv){

    detectColor(
        hsv,
        [0,120,70,0],
        [10,255,255,255],
        addWindow
    );
}

function detectGreen(hsv){

    detectColor(
        hsv,
        [40,50,50,0],
        [90,255,255,255],
        addDoor
    );
}

function detectBlue(hsv){

    detectColor(
        hsv,
        [90,50,50,0],
        [140,255,255,255],
        addOpening
    );
}

if(navigator.xr){

    console.log("WebXR підтримується");

}else{

    console.warn("WebXR не підтримується");

}

startCamera();

</script>

</body>
</html>
