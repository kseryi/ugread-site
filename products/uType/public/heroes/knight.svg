<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" class="hero-svg">
  <defs>
    <!-- Градієнти для Лицаря -->
    <radialGradient id="knt_skin" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff5eb"/>
      <stop offset="75%" stop-color="#fde3cd"/>
      <stop offset="100%" stop-color="#f6cca9"/>
    </radialGradient>
    <linearGradient id="knt_steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d9e2ec"/>
      <stop offset="70%" stop-color="#9fb3c8"/>
      <stop offset="100%" stop-color="#627d98"/>
    </linearGradient>
    <linearGradient id="knt_steel_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#829ab1"/>
      <stop offset="100%" stop-color="#334e68"/>
    </linearGradient>
    <linearGradient id="knt_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9db"/>
      <stop offset="45%" stop-color="#f59f00"/>
      <stop offset="100%" stop-color="#d9480f"/>
    </linearGradient>
    <linearGradient id="knt_cape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="60%" stop-color="#d63031"/>
      <stop offset="100%" stop-color="#800e13"/>
    </linearGradient>
    <linearGradient id="knt_plume" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="50%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#b71540"/>
    </linearGradient>
    <linearGradient id="knt_sword" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="50%" stop-color="#bcccdc"/>
      <stop offset="100%" stop-color="#486581"/>
    </linearGradient>
    <radialGradient id="knt_gem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#64b5f6"/>
      <stop offset="60%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </radialGradient>
    <radialGradient id="knt_cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7675" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff7675" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Королівський червоний лицарський плащ (позаду) -->
  <path d="M 24 44 Q 10 65 12 82 Q 40 88 68 82 Q 70 65 56 44 Z" fill="url(#knt_cape)"/>

  <!-- Ліва нога у сталевих поножах (шарнір 25, 88) -->
  <g class="ll">
    <!-- Поножі (greaves) -->
    <path d="M 20 78 L 30 78 L 32 91 L 18 91 Z" fill="url(#knt_steel)"/>
    <!-- Наколінник (poleyn) -->
    <circle cx="25" cy="80" r="4.5" fill="url(#knt_steel)"/>
    <circle cx="25" cy="80" r="2.5" fill="url(#knt_gold)"/>
    <!-- Латний чобіт (sabaton) -->
    <path d="M 17 88 Q 25 86 33 88 L 33 93 Q 25 94 16 93 Z" fill="url(#knt_steel_dark)"/>
  </g>

  <!-- Права нога у сталевих поножах (шарнір 55, 88) -->
  <g class="lr">
    <!-- Поножі -->
    <path d="M 50 78 L 60 78 L 62 91 L 48 91 Z" fill="url(#knt_steel)"/>
    <!-- Наколінник -->
    <circle cx="55" cy="80" r="4.5" fill="url(#knt_steel)"/>
    <circle cx="55" cy="80" r="2.5" fill="url(#knt_gold)"/>
    <!-- Латний чобіт -->
    <path d="M 47 88 Q 55 86 63 88 L 63 93 Q 55 94 46 93 Z" fill="url(#knt_steel_dark)"/>
  </g>

  <!-- Лицарська кіраса (обладунки тулуба) -->
  <g>
    <!-- Базова сталева пластина -->
    <path d="M 26 40 L 22 68 Q 40 73 58 68 L 54 40 Z" fill="url(#knt_steel)"/>
    <!-- Центральне ребро жорсткості кіраси -->
    <line x1="40" y1="42" x2="40" y2="68" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Золотий герб на грудях (лицарський лев / королівська зірка) -->
    <circle cx="40" cy="52" r="6.5" fill="url(#knt_gold)"/>
    <!-- Фігура зірки/лева -->
    <polygon points="40,47 41.5,50.5 45,51 42.5,53.5 43,57 40,55 37,57 37.5,53.5 35,51 38.5,50.5" fill="#ffffff"/>
    
    <!-- Пояс з золотими заклепками -->
    <path d="M 23 66 Q 40 71 57 66 L 56 71 Q 40 76 24 71 Z" fill="url(#knt_cape)"/>
    <rect x="36" y="67" width="8" height="6" rx="1.5" fill="url(#knt_gold)"/>
    
    <!-- Золоті заклепки на броні -->
    <circle cx="28" cy="44" r="1.5" fill="url(#knt_gold)"/>
    <circle cx="52" cy="44" r="1.5" fill="url(#knt_gold)"/>
  </g>

  <!-- Ліва рука з лицарським щитом (шарнір 12, 48) -->
  <g class="al">
    <!-- Наплічник (pauldron) -->
    <circle cx="20" cy="44" r="7" fill="url(#knt_steel)"/>
    <path d="M 14 44 Q 20 40 26 44" stroke="url(#knt_gold)" stroke-width="1.5" fill="none"/>
    <!-- Рука -->
    <path d="M 18 46 L 14 58 L 20 62 L 22 48 Z" fill="url(#knt_steel_dark)"/>
    
    <!-- Геральдичний лицарський щит (heater shield) -->
    <g transform="rotate(8 16 58)">
      <!-- Тінь щита -->
      <path d="M 6 42 L 26 42 Q 26 62 16 74 Q 6 62 6 42 Z" fill="#102a43" opacity="0.3" transform="translate(1, 1)"/>
      <!-- Основне поле щита -->
      <path d="M 6 42 L 26 42 Q 26 62 16 74 Q 6 62 6 42 Z" fill="url(#knt_cape)"/>
      <!-- Золота половина щита (розділене геральдичне поле) -->
      <path d="M 16 42 L 26 42 Q 26 62 16 74 Z" fill="url(#knt_gold)"/>
      <!-- Золота окантовка щита з заклепками -->
      <path d="M 6 42 L 26 42 Q 26 62 16 74 Q 6 62 6 42 Z" stroke="url(#knt_gold)" stroke-width="2" fill="none"/>
      <!-- Срібний геральдичний хрест/зірка на щиті -->
      <polygon points="16,50 17.5,54 21.5,55 18,57.5 19,61.5 16,59 13,61.5 14,57.5 10.5,55 14.5,54" fill="#ffffff"/>
    </g>
  </g>

  <!-- Права рука з лицарським мечем (шарнір 68, 48) -->
  <g class="ar">
    <!-- Наплічник (pauldron) -->
    <circle cx="60" cy="44" r="7" fill="url(#knt_steel)"/>
    <path d="M 54 44 Q 60 40 66 44" stroke="url(#knt_gold)" stroke-width="1.5" fill="none"/>
    <!-- Рука в залізній рукавиці -->
    <path d="M 62 46 L 65 58 L 59 62 L 58 48 Z" fill="url(#knt_steel_dark)"/>
    
    <!-- Сяючий сталевий меч -->
    <g transform="rotate(-12 64 56)">
      <!-- Лезо меча -->
      <path d="M 63 16 L 65 10 L 67 16 L 66.5 56 L 63.5 56 Z" fill="url(#knt_sword)"/>
      <!-- Дол (жолобок) по центру леза -->
      <line x1="65" y1="14" x2="65" y2="54" stroke="#ffffff" stroke-width="0.9"/>
      <!-- Золота гарда (хрестовина) -->
      <rect x="58" y="55" width="14" height="4" rx="1.5" fill="url(#knt_gold)"/>
      <circle cx="59" cy="57" r="1.2" fill="#d9480f"/>
      <circle cx="71" cy="57" r="1.2" fill="#d9480f"/>
      <!-- Руків'я -->
      <rect x="63.5" y="59" width="3" height="7" rx="1" fill="#486581"/>
      <!-- Золоте яблуко (навершя) з синім сапфіром -->
      <circle cx="65" cy="68" r="3" fill="url(#knt_gold)"/>
      <circle cx="65" cy="68" r="1.8" fill="url(#knt_gem)"/>
    </g>
  </g>

  <!-- Голова у лицарському шоломі з відкритим забралом (анімується .phead, точка 40, 24) -->
  <g class="phead">
    <!-- Лицарський шолом (задня та верхня півсфера) -->
    <path d="M 20 22 C 20 9 60 9 60 22 L 61 36 C 61 41 57 44 54 44 L 26 44 C 23 44 19 41 19 36 Z" fill="url(#knt_steel)"/>
    
    <!-- Відкрите забрало: показує сміливе веселе личко лицаря -->
    <circle cx="40" cy="26" r="15" fill="url(#knt_skin)"/>

    <!-- Рум'яні щічки -->
    <circle cx="30" cy="29" r="3.5" fill="url(#knt_cheek)"/>
    <circle cx="50" cy="29" r="3.5" fill="url(#knt_cheek)"/>

    <!-- Сміливі ясні волошкові оченята -->
    <!-- Ліве око -->
    <g>
      <ellipse cx="32" cy="24" rx="3.8" ry="4.5" fill="#ffffff"/>
      <ellipse cx="32.5" cy="24.5" rx="2.8" ry="3.5" fill="url(#knt_gem)"/>
      <circle cx="33" cy="24.8" r="1.8" fill="#0b2b52"/>
      <circle cx="33.8" cy="23" r="1.2" fill="#ffffff"/>
      <circle cx="31.2" cy="25.5" r="0.6" fill="#ffffff"/>
      <path d="M 28 19 Q 32 17 36 20" stroke="#8c502b" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Праве око -->
    <g>
      <ellipse cx="48" cy="24" rx="3.8" ry="4.5" fill="#ffffff"/>
      <ellipse cx="47.5" cy="24.5" rx="2.8" ry="3.5" fill="url(#knt_gem)"/>
      <circle cx="47" cy="24.8" r="1.8" fill="#0b2b52"/>
      <circle cx="47.8" cy="23" r="1.2" fill="#ffffff"/>
      <circle cx="45.2" cy="25.5" r="0.6" fill="#ffffff"/>
      <path d="M 44 20 Q 48 17 52 19" stroke="#8c502b" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Маленький носик -->
    <path d="M 39 27 Q 40 28.5 41 27" stroke="#cb7a58" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Смілива відкрита усмішка -->
    <path d="M 36 30 Q 40 34 44 30" stroke="#873600" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Підняте решітчасте забрало шолома над лобом -->
    <g>
      <!-- Дуга забрала -->
      <path d="M 22 17 Q 40 10 58 17 L 57 21 Q 40 14 23 21 Z" fill="url(#knt_steel_dark)"/>
      <path d="M 22 17 Q 40 10 58 17" stroke="url(#knt_gold)" stroke-width="1.8" fill="none"/>
      <!-- Оглядові щілини / візерунок -->
      <line x1="32" y1="16" x2="33" y2="19" stroke="url(#knt_gold)" stroke-width="1.2"/>
      <line x1="40" y1="15" x2="40" y2="18" stroke="url(#knt_gold)" stroke-width="1.2"/>
      <line x1="48" y1="16" x2="47" y2="19" stroke="url(#knt_gold)" stroke-width="1.2"/>
      <!-- Золоті петлі забрала -->
      <circle cx="21" cy="20" r="2.2" fill="url(#knt_gold)"/>
      <circle cx="59" cy="20" r="2.2" fill="url(#knt_gold)"/>
    </g>

    <!-- Гордий червоний лицарський плюмаж (пір'я на верхівці шолома) -->
    <g>
      <!-- Тримач плюмажу -->
      <rect x="37" y="6" width="6" height="4" rx="1" fill="url(#knt_gold)"/>
      <!-- Пишне червоне пір'я, що майорить -->
      <path d="M 40 7 Q 38 -5 48 -2 Q 54 2 56 12 Q 48 8 40 7 Z" fill="url(#knt_plume)"/>
      <path d="M 39 7 Q 32 -3 40 -6 Q 47 -4 44 5 Z" fill="#ff7675"/>
    </g>
  </g>
</svg>
