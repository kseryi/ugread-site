<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" class="hero-svg">
  <defs>
    <!-- Тіні та градієнти для Пандочки -->
    <radialGradient id="pnd_white" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f0f3f6"/>
      <stop offset="100%" stop-color="#dde2e8"/>
    </radialGradient>
    <radialGradient id="pnd_tummy" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#e3e7ee"/>
    </radialGradient>
    <linearGradient id="pnd_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d4451"/>
      <stop offset="60%" stop-color="#22262f"/>
      <stop offset="100%" stop-color="#14171d"/>
    </linearGradient>
    <radialGradient id="pnd_ear" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffb8c6"/>
      <stop offset="100%" stop-color="#f07289"/>
    </radialGradient>
    <radialGradient id="pnd_cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fa3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff8fa3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pnd_scarf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <radialGradient id="pnd_bell" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="60%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </radialGradient>
    <linearGradient id="pnd_bamboo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="60%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>

  <!-- Задня тінь / хвостик -->
  <circle cx="40" cy="76" r="6" fill="url(#pnd_dark)"/>

  <!-- Ліва ніжка (анімується .ll, шарнір 25, 88) -->
  <g class="ll">
    <ellipse cx="25" cy="87" rx="10" ry="8" fill="url(#pnd_dark)"/>
    <!-- Рожеві подушечки лапки -->
    <ellipse cx="25" cy="87" rx="5" ry="4" fill="#ffb8c6" opacity="0.9"/>
    <circle cx="21" cy="82" r="1.5" fill="#ffccd5"/>
    <circle cx="25" cy="81" r="1.5" fill="#ffccd5"/>
    <circle cx="29" cy="82" r="1.5" fill="#ffccd5"/>
  </g>

  <!-- Права ніжка (анімується .lr, шарнір 55, 88) -->
  <g class="lr">
    <ellipse cx="55" cy="87" rx="10" ry="8" fill="url(#pnd_dark)"/>
    <!-- Рожеві подушечки лапки -->
    <ellipse cx="55" cy="87" rx="5" ry="4" fill="#ffb8c6" opacity="0.9"/>
    <circle cx="51" cy="82" r="1.5" fill="#ffccd5"/>
    <circle cx="55" cy="81" r="1.5" fill="#ffccd5"/>
    <circle cx="59" cy="82" r="1.5" fill="#ffccd5"/>
  </g>

  <!-- Тулуб панди -->
  <ellipse cx="40" cy="62" rx="25" ry="22" fill="url(#pnd_dark)"/>
  <!-- Пухнастий білий животик -->
  <ellipse cx="40" cy="63" rx="18" ry="17" fill="url(#pnd_tummy)"/>
  
  <!-- Святковий червоний шарфик -->
  <path d="M 23 44 Q 40 50 57 44 Q 58 48 55 52 Q 40 57 25 52 Z" fill="url(#pnd_scarf)"/>
  <!-- Кінчик шарфика -->
  <path d="M 44 49 Q 47 58 49 64 Q 44 65 41 59 Q 42 53 43 49 Z" fill="url(#pnd_scarf)"/>
  <!-- Золотий дзвіночок -->
  <circle cx="40" cy="51" r="4" fill="url(#pnd_bell)"/>
  <circle cx="40" cy="52" r="1" fill="#795548"/>

  <!-- Ліва рука (шарнір 12, 48) -->
  <g class="al">
    <ellipse cx="15" cy="50" rx="7.5" ry="14" transform="rotate(18 15 50)" fill="url(#pnd_dark)"/>
    <circle cx="12" cy="58" r="3" fill="#ffb8c6" opacity="0.75"/>
  </g>

  <!-- Права рука з бамбуком (шарнір 68, 48) -->
  <g class="ar">
    <!-- Стебло бамбука -->
    <g transform="rotate(-15 65 48)">
      <rect x="65" y="24" width="4" height="34" rx="2" fill="url(#pnd_bamboo)"/>
      <line x1="64" y1="32" x2="70" y2="32" stroke="#2e7d32" stroke-width="1"/>
      <line x1="64" y1="42" x2="70" y2="42" stroke="#2e7d32" stroke-width="1"/>
      <!-- Листочок бамбука -->
      <path d="M 68 28 Q 78 24 76 18 Q 70 23 68 28 Z" fill="#81c784"/>
      <path d="M 66 36 Q 56 34 58 28 Q 64 32 66 36 Z" fill="#66bb6a"/>
    </g>
    <!-- Сама лапка -->
    <ellipse cx="65" cy="50" rx="7.5" ry="14" transform="rotate(-18 65 50)" fill="url(#pnd_dark)"/>
    <circle cx="68" cy="58" r="3" fill="#ffb8c6" opacity="0.75"/>
  </g>

  <!-- Голова (анімується .phead, точка хитання 40, 24) -->
  <g class="phead">
    <!-- Вушка -->
    <g>
      <circle cx="21" cy="9" r="10" fill="url(#pnd_dark)"/>
      <circle cx="22" cy="10" r="5.5" fill="url(#pnd_ear)"/>
      
      <circle cx="59" cy="9" r="10" fill="url(#pnd_dark)"/>
      <circle cx="58" cy="10" r="5.5" fill="url(#pnd_ear)"/>
    </g>

    <!-- Основне коло голови -->
    <circle cx="40" cy="24" r="22" fill="url(#pnd_white)"/>
    <ellipse cx="40" cy="22" rx="21" ry="19" fill="url(#pnd_white)"/>

    <!-- Рожеві щічки рум'янцю -->
    <circle cx="23" cy="29" r="6" fill="url(#pnd_cheek)"/>
    <circle cx="57" cy="29" r="6" fill="url(#pnd_cheek)"/>

    <!-- Чорні цятки навколо очей -->
    <ellipse cx="29" cy="22" rx="6.5" ry="8" transform="rotate(-14 29 22)" fill="url(#pnd_dark)"/>
    <ellipse cx="51" cy="22" rx="6.5" ry="8" transform="rotate(14 51 22)" fill="url(#pnd_dark)"/>

    <!-- Великі живі блискучі очі -->
    <!-- Ліве око -->
    <circle cx="30" cy="22" r="4.2" fill="#111317"/>
    <circle cx="31.2" cy="20.5" r="1.8" fill="#ffffff"/>
    <circle cx="28.8" cy="23.5" r="0.9" fill="#ffffff"/>

    <!-- Праве око -->
    <circle cx="50" cy="22" r="4.2" fill="#111317"/>
    <circle cx="51.2" cy="20.5" r="1.8" fill="#ffffff"/>
    <circle cx="48.8" cy="23.5" r="0.9" fill="#ffffff"/>

    <!-- Маленький блискучий носик -->
    <path d="M 37 27 Q 40 25.5 43 27 Q 41.5 30 40 30 Q 38.5 30 37 27 Z" fill="#22262f"/>
    <ellipse cx="39.5" cy="27" rx="1.2" ry="0.6" fill="#ffffff" opacity="0.7"/>

    <!-- Задоволений ротик з язичком -->
    <path d="M 36 30 Q 40 33 44 30" stroke="#22262f" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 38 31 Q 40 35 42 31 Z" fill="#ff7289"/>

    <!-- Маленький зелений росточок на маківці для милоти -->
    <path d="M 40 2 Q 44 -4 47 0 Q 43 2 40 2 Z" fill="#81c784"/>
    <path d="M 40 2 Q 35 -3 33 1 Q 38 3 40 2 Z" fill="#66bb6a"/>
  </g>
</svg>
