<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UGREAD — Інтерактивна Дошка для Школи</title>
  <meta name="description" content="Багатофункціональна автономна інтерактивна дошка з підтримкою мультитач письма, векторної графіки, зошитів у косу лінію та клітинку, та предметних модулів з симуляціями." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="theme-light">
  <div id="app" class="app-root">
    
    <!-- TOPBAR: Верхня навігація та глобальні дії -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button id="btnToggleLeft" class="btn-icon" title="Сховати/показати панель інструментів (Tab)" aria-label="Панель інструментів">
          <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <div class="brand-logo" title="UGREAD Інтерактивна дошка">
          <svg class="logo-icon" viewBox="0 0 32 32" width="28" height="28">
            <path d="M4 6v12a8 8 0 0 0 16 0V6h-4v12a4 4 0 0 1-8 0V6H4z" fill="#2563eb"/>
            <polygon points="22,6 18,26 28,26" fill="#1e40af"/>
            <polygon points="22,6 28,26 31,18" fill="#60a5fa" opacity="0.8"/>
            <polygon points="22,6 25,12 28,26" fill="#93c5fd" opacity="0.6"/>
          </svg>
          <span class="brand-text">UGREAD<span class="brand-sub">BOARD</span></span>
        </div>

        <div class="divider-v"></div>

        <!-- Перемикач сторінок/слайдів уроку -->
        <div class="slide-nav" id="slideNav">
          <button id="btnPrevSlide" class="btn-icon-sm" title="Попередній слайд (PageUp)">❮</button>
          <span class="slide-counter" id="slideIndicator" title="Поточний слайд / Всього">1 / 1</span>
          <button id="btnNextSlide" class="btn-icon-sm" title="Наступний слайд (PageDown)">❯</button>
          <button id="btnAddSlide" class="btn-icon-sm btn-accent" title="Додати нову сторінку до уроку">+</button>
        </div>
      </div>

      <div class="topbar-center">
        <!-- Режим фону / Розліновка зошита (Початкова школа) -->
        <div class="ruling-selector-wrap">
          <span class="ruling-label">Фон:</span>
          <select id="rulingSelect" class="styled-select" title="Оберіть розліновку зошита чи колір дошки">
            <optgroup label="Шкільні дошки">
              <option value="white" selected>⚪ Чиста біла дошка</option>
              <option value="chalkboard_green">🟢 Зелена крейдова дошка</option>
              <option value="chalkboard_black">⚫ Грифельна темна дошка</option>
            </optgroup>
            <optgroup label="Зошити (Початкова школа МОН)">
              <option value="slanted_primary">📝 Коса лінія з додатковою (1 клас, як зразок)</option>
              <option value="slanted_primary_dense">✍️ Часта коса лінія (Прописи / Каліграфія)</option>
              <option value="slanted_primary_simple">📄 Коса лінія без додаткової (2 клас)</option>
              <option value="squared_math">📐 Зошит у клітинку (5x5 мм)</option>
              <option value="lined_regular">📖 Зошит у звичайну лінію</option>
              <option value="lined_narrow">📑 Зошит у вузьку лінію</option>
              <option value="music_stave">🎵 Нотний стан (5 лінійок)</option>
            </optgroup>
            <optgroup label="Координатні сітки">
              <option value="cartesian_grid">📈 Декартова система координат</option>
              <option value="dot_grid">▫ Точкова сітка (Dot Grid)</option>
              <option value="isometric_grid">🔺 Ізометрична 3D сітка</option>
            </optgroup>
          </select>
        </div>

        <!-- Перемикач полів зошита -->
        <div class="ruling-selector-wrap" id="marginSelectorWrap" title="Поля зошита (червона лінія)">
          <select id="marginSelect" class="styled-select" title="Розташування червоних полів">
            <option value="none" selected>⚪ Без полів</option>
            <option value="right">🔴 Поле праворуч (А5)</option>
            <option value="left">🔴 Поле ліворуч</option>
            <option value="both">🔴 Поля з обох боків</option>
          </select>
        </div>

        <!-- Швидкий регулятор масштабу розліновки/сітки -->
        <div class="ruling-scale-box" id="rulingScaleBox" title="Масштаб клітинок / лінійок">
          <span class="scale-icon">🔍</span>
          <input type="range" id="rulingScaleInput" min="16" max="72" value="32" step="1" title="Розмір клітинки/рядка">
          <span id="rulingScaleVal" class="scale-val">32px</span>
        </div>
      </div>

      <div class="topbar-right">
        <!-- Мультитач перемикач -->
        <button id="btnMultitouch" class="btn-chip active" title="Мультитач письмо (одночасно декілька пальців / стилусів)">
          <span class="chip-dot"></span>
          <svg viewBox="0 0 24 24" width="16" height="16" class="chip-icon"><path d="M9 11.24V7.5a2.5 2.5 0 0 1 5 0v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.02-.24-.02-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.43 1.06.43h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.06.01-.13.01-.2 0-.64-.4-1.21-1.04-1.41z" fill="currentColor"/></svg>
          <span class="chip-text">Мультитач</span>
        </button>

        <!-- Відміна / Повтор -->
        <button id="btnUndo" class="btn-icon" title="Скасувати (Ctrl+Z)" disabled>
          <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
        </button>
        <button id="btnRedo" class="btn-icon" title="Повторити (Ctrl+Y)" disabled>
          <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
        </button>

        <div class="divider-v"></div>

        <!-- Очистити / Експорт -->
        <button id="btnClearBoard" class="btn-icon" title="Очистити поточну дошку">
          <svg viewBox="0 0 24 24"><path d="M15 4V3H9v1H4v2h1v13c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V6h1V4h-5zm2 15H7V6h10v13zM9 8h2v9H9zm4 0h2v9h-2z"/></svg>
        </button>

        <!-- Експорт / Збереження меню -->
        <div class="dropdown-wrap">
          <button id="btnExportMenu" class="btn-icon" title="Зберегти / Експорт (PNG, SVG, PDF, Проєкт)">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
          </button>
          <div class="dropdown-menu" id="exportMenu">
            <button id="exportPNG" class="dropdown-item">🖼 Завантажити як PNG зображення</button>
            <button id="exportSVG" class="dropdown-item">📐 Завантажити векторний SVG</button>
            <button id="exportPrint" class="dropdown-item">🖨 Друкувати / Зберегти як PDF</button>
            <div class="dropdown-divider"></div>
            <button id="saveProject" class="dropdown-item">💾 Зберегти проєкт дошки (.json)</button>
            <label class="dropdown-item file-label">
              📂 Відкрити проєкт дошки
              <input type="file" id="loadProjectInput" accept=".json" style="display:none;" />
            </label>
          </div>
        </div>

        <!-- Вибір предметного модуля -->
        <div class="subject-select-wrap">
          <select id="subjectSelect" class="styled-select select-subject" title="Оберіть предмет для відкриття спеціальних інструментів">
            <option value="informatics" selected>💻 Інформатика & Веб (URL)</option>
            <option value="primary">🎒 Початкова школа</option>
            <option value="ukr">📖 Українська мова</option>
            <option value="math">📐 Математика & Геометрія</option>
            <option value="geography">🌍 Географія & Карти</option>
            <option value="physics">⚡ Фізика & Схеми</option>
            <option value="chemistry">🧪 Хімія & Елементи</option>
            <option value="history">⏳ Історія & Стрічка часу</option>
            <option value="simulations">🕹 Інтерактивні Симуляції</option>
          </select>
        </div>

        <!-- Кнопка розгортання правої панелі -->
        <button id="btnToggleRight" class="btn-icon btn-active-indicator" title="Спеціальна панель предмету">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm8 2h2v8h-2V8z"/></svg>
        </button>
      </div>
    </header>

    <!-- ОСНОВНА РОБОЧА ЗОНА -->
    <div class="workspace">
      
      <!-- ЛІВА ПАНЕЛЬ ІНСТРУМЕНТІВ (МАЛЮВАННЯ) -->
      <aside class="toolbar-left" id="leftToolbar">
        <div class="tool-section">
          <!-- Вибір та переміщення -->
          <button class="tool-btn" data-tool="select" title="Курсор / Вибір та трансформація (V)">
            <svg viewBox="0 0 24 24"><path d="M7 2l12 11.2-5.8.5 3.3 7.3-2.2 1-3.2-7.4L7 18.5V2z"/></svg>
          </button>
          
          <!-- Перо / Олівець -->
          <button class="tool-btn active" data-tool="pencil" title="Олівець / Ручка (P)">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          </button>

          <!-- Каліграфічне перо -->
          <button class="tool-btn" data-tool="calligraphy" title="Каліграфічне перо (C)">
            <svg viewBox="0 0 24 24"><path d="M2.5 19h19v2h-19v-2zm16.84-13.41L18.42 4.5c-.39-.39-1.02-.39-1.41 0L12 9.5 7.5 5 6.09 6.41 10.59 10.9 2 19.5h3.5l7.5-7.5 4.5 4.5 1.41-1.41-4.5-4.5 4.93-4.9c.39-.39.39-1.02 0-1.41z"/></svg>
          </button>

          <!-- Маркер-виділювач -->
          <button class="tool-btn" data-tool="highlighter" title="Маркер-текстовиділювач (H)">
            <svg viewBox="0 0 24 24"><path d="M15.24 3.76a2.5 2.5 0 0 1 3.53 0l1.47 1.47a2.5 2.5 0 0 1 0 3.53l-9.18 9.18-4.95.71.71-4.95 8.42-8.42v-.52zm-1.41 1.41L6.11 12.89l-.35 2.47 2.47-.35 7.72-7.72-2.12-2.12zM3 21h18v-2H3v2z"/></svg>
          </button>

          <!-- Лазерна указка -->
          <button class="tool-btn" data-tool="laser" title="Лазерна указка (L)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2"/></svg>
          </button>

          <!-- Гумка -->
          <button class="tool-btn" data-tool="eraser" title="Гумка (E)">
            <svg viewBox="0 0 24 24"><path d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12 20.5H6.5l-3.24-3.24c-.78-.79-.78-2.05 0-2.84L13.4 3.56c.78-.78 2.05-.78 2.84 0zm-2.83 2.83L5.64 14.16 8.82 17.34 16.59 9.57 13.41 6.39z"/></svg>
          </button>
        </div>

        <div class="divider-h"></div>

        <!-- Фігури меню -->
        <div class="tool-section">
          <div class="dropdown-wrap-side">
            <button class="tool-btn" id="btnShapesMenu" data-tool="shape" title="Геометричні фігури">
              <svg viewBox="0 0 24 24"><polygon points="12,2 2,22 22,22" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="14" r="3" fill="currentColor"/></svg>
            </button>
            <div class="shapes-palette" id="shapesPalette">
              <div class="palette-title">Фігури & Лінії:</div>
              <div class="shapes-grid">
                <button class="shape-opt" data-shape="line" title="Пряма лінія"><svg viewBox="0 0 24 24"><line x1="3" y1="21" x2="21" y2="3" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="arrow" title="Стрілка"><svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2"/><polyline points="15,6 21,12 15,18" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="double_arrow" title="Подвійна стрілка"><svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2"/><polyline points="7,6 2,12 7,18" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="17,6 22,12 17,18" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="wavy_line" title="Хвиляста лінія (Означення 〰)"><svg viewBox="0 0 24 24"><path d="M2 12 Q 5 6 8 12 T 14 12 T 20 12 T 24 12" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="double_line" title="Подвійна лінія (Присудок ═)"><svg viewBox="0 0 24 24"><line x1="3" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="2"/><line x1="3" y1="15" x2="21" y2="15" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="rect" title="Прямокутник"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="round_rect" title="Заокруглений прямокутник"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="circle" title="Коло"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="ellipse" title="Еліпс"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="triangle" title="Трикутник"><svg viewBox="0 0 24 24"><polygon points="12,4 3,20 21,20" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="right_triangle" title="Прямокутний трикутник"><svg viewBox="0 0 24 24"><polygon points="4,4 4,20 20,20" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="rhombus" title="Ромб"><svg viewBox="0 0 24 24"><polygon points="12,3 21,12 12,21 3,12" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="trapezoid" title="Трапеція"><svg viewBox="0 0 24 24"><polygon points="7,5 17,5 21,19 3,19" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="pentagon" title="П'ятикутник"><svg viewBox="0 0 24 24"><polygon points="12,3 21,10 18,20 6,20 3,10" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="hexagon" title="Шестикутник"><svg viewBox="0 0 24 24"><polygon points="7,4 17,4 21,12 17,20 7,20 3,12" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="star" title="Зірка"><svg viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button class="shape-opt" data-shape="coordinate_system" title="Координатні осі X/Y"><svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2"/><line x1="12" y1="21" x2="12" y2="3" stroke="currentColor" stroke-width="2"/><polyline points="18,9 21,12 18,15" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="9,6 12,3 15,6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
              </div>
            </div>
          </div>

          <!-- Текст -->
          <button class="tool-btn" data-tool="text" title="Текст (T)">
            <svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4z"/></svg>
          </button>

          <!-- Екранні інструменти (Лінійка, Транспортир, Косинець) -->
          <div class="dropdown-wrap-side">
            <button class="tool-btn" id="btnRulerTools" title="Екранні вимірювальні інструменти">
              <svg viewBox="0 0 24 24"><path d="M21 3L3 21l3 3L24 6l-3-3zM8.5 18.5l-1.4-1.4 1.4-1.4 1.4 1.4-1.4 1.4zm2.8-2.8l-1.4-1.4 1.4-1.4 1.4 1.4-1.4 1.4zm2.8-2.8l-1.4-1.4 1.4-1.4 1.4 1.4-1.4 1.4zm2.8-2.8l-1.4-1.4 1.4-1.4 1.4 1.4-1.4 1.4z"/></svg>
            </button>
            <div class="shapes-palette" id="rulerToolsPalette">
              <div class="palette-title">Шкільні інструменти:</div>
              <button class="menu-action-btn" id="toggleScreenRuler">📏 Екранна лінійка (30 см)</button>
              <button class="menu-action-btn" id="toggleScreenProtractor">📐 Транспортир (180°)</button>
              <button class="menu-action-btn" id="toggleScreenTriangle">📐 Косинець (90°-45°)</button>
            </div>
          </div>

          <!-- Вставити зображення / медіа -->
          <label class="tool-btn" title="Вставити зображення (PNG/JPG/SVG)">
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            <input type="file" id="imageUploadInput" accept="image/*" style="display:none;" />
          </label>
        </div>

        <div class="divider-h"></div>

        <!-- Палітра кольорів та товщини (Швидкий доступ) -->
        <div class="tool-settings-compact">
          <div class="color-picker-wrap" title="Вибрати колір">
            <input type="color" id="strokeColorInput" value="#1e3a8a" class="color-native" />
            <div class="color-preview" id="colorPreview" style="background:#1e3a8a"></div>
          </div>
          
          <div class="preset-colors">
            <button class="color-dot active" data-color="#1e3a8a" style="background:#1e3a8a" title="Синій"></button>
            <button class="color-dot" data-color="#dc2626" style="background:#dc2626" title="Червоний"></button>
            <button class="color-dot" data-color="#16a34a" style="background:#16a34a" title="Зелений"></button>
            <button class="color-dot" data-color="#111827" style="background:#111827" title="Чорний"></button>
            <button class="color-dot" data-color="#d97706" style="background:#d97706" title="Жовтий/Оранжевий"></button>
            <button class="color-dot" data-color="#9333ea" style="background:#9333ea" title="Фіолетовий"></button>
            <button class="color-dot" data-color="#ffffff" style="background:#ffffff; border:1px solid #ccc;" title="Білий"></button>
          </div>

          <!-- Повзунок товщини лінії -->
          <div class="stroke-width-box" title="Товщина лінії">
            <input type="range" id="strokeWidthInput" min="1" max="30" value="3" />
            <span id="strokeWidthVal" class="stroke-val">3px</span>
          </div>

          <!-- Стиль лінії -->
          <div class="style-toggle-box">
            <button class="style-btn active" data-style="solid" title="Суцільна лінія">―</button>
            <button class="style-btn" data-style="dashed" title="Штрихова лінія">---</button>
            <button class="style-btn" data-style="dotted" title="Пунктир">···</button>
          </div>

          <!-- Заливка фігури -->
          <label class="checkbox-label" title="Увімкнути/вимкнути заливку фігури">
            <input type="checkbox" id="fillCheckbox" />
            <span>Заливка</span>
          </label>
        </div>
      </aside>

      <!-- ГОЛОВНЕ ПОЛОТНО ДОШКИ -->
      <main class="board-container" id="boardContainer">
        
        <!-- ІНТЕРАКТИВНИЙ ШАР СИМУЛЯЦІЇ / САЙТУ / PDF (IFRAME & WEBPAGE CONTAINER) -->
        <div class="simulation-layer-container" id="simulationContainer" style="display:none;">
          
          <!-- ПАНЕЛЬ КЕРУВАННЯ СИМУЛЯЦІЄЮ З 2-МА РЕЖИМАМИ (ЗА ТЗ) -->
          <div class="simulation-top-control-bar" id="simControlBar">
            <div class="sim-mode-toggle-group">
              <button id="btnSimModeInteract" class="sim-mode-btn active" title="Режим 1: Повне керування симуляцією/сайтом (кліки, перетягування всередині сайту)">
                <span class="sim-icon">🎮</span> Режим 1: Керування сайтом
              </button>
              <button id="btnSimModeDrawOver" class="sim-mode-btn" title="Режим 2: Малювання та анотації поверх симуляції">
                <span class="sim-icon">✏️</span> Режим 2: Малювання поверх
              </button>
            </div>

            <div class="sim-layer-actions">
              <span id="simTitleBadge" class="sim-title-badge">Симуляція</span>
              <a id="btnSimOpenNewTab" href="#" target="_blank" rel="noopener noreferrer" class="sim-action-btn" title="Відкрити цей сайт у новій вкладці браузера" style="display:none; text-decoration:none; color:inherit;">
                ↗️ Відкрити в новій вкладці
              </a>
              <button id="btnToggleSimDrawingLayer" class="sim-action-btn" title="Увімкнути/вимкнути видимість малюнків поверх симуляції">
                👁️ Шар малюнків: <span id="simLayerStatus">Увімкн.</span>
              </button>
              <button id="btnClearSimDrawingLayer" class="sim-action-btn btn-danger-soft" title="Видалити всі малюнки над цією симуляцією">
                🗑️ Очистити шар
              </button>
              <button id="btnCloseSimulation" class="sim-action-btn btn-close-sim" title="Закрити симуляцію та повернутись до дошки">
                ✖ Закрити
              </button>
            </div>
          </div>

          <!-- Контейнер для вбудованої HTML5 симуляції або зовнішнього сайту -->
          <div class="simulation-viewport" id="simViewport">
            <iframe id="simulationIframe" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" allow="accelerometer; autoplay; camera; gyroscope; microphone"></iframe>
            <div id="simulationLocalHost" class="sim-local-host" style="display:none;"></div>
          </div>
        </div>

        <!-- ОСНОВНИЙ SVG + CANVAS BOARD -->
        <svg id="boardSvg" class="board-svg" xmlns="http://www.w3.org/2000/svg" touch-action="none">
          <defs id="svgDefs">
            <!-- Стрілки та маркери -->
            <marker id="markerArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
              <path d="M1,1 L7,4 L1,7 z" fill="#1e3a8a" id="markerArrowPath"/>
            </marker>
            <marker id="markerArrowStart" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
              <path d="M7,1 L1,4 L7,7 z" fill="#1e3a8a" id="markerArrowStartPath"/>
            </marker>
            <!-- Патерни розліновки зошитів генеруються динамічно в rulings.js -->
          </defs>

          <!-- Група трансформації зуму/панорамування всього полотна -->
          <g id="viewportGroup">
            <!-- 1. ШАР РОЗЛІНОВКИ ТА ФОНУ (Зошит у косу лінію, клітинку, лінію, декартова сітка) -->
            <rect id="boardBackdrop" x="-50000" y="-50000" width="100000" height="100000" fill="#ffffff"></rect>
            <g id="rulingLayer"></g>
            <g id="marginLinesLayer"></g>

            <!-- 2. ШАР ФОНОВИХ ЗОБРАЖЕНЬ ТА PDF СТОРІНОК -->
            <g id="backgroundLayer"></g>

            <!-- 3. ШАР ВЕКТОРНИХ МАЛЮНКІВ ТА ФІГУР -->
            <g id="drawingLayer"></g>

            <!-- 4. ТИМЧАСОВИЙ ШАР ДЛЯ ПОТОЧНИХ ШТРИХІВ (МУЛЬТИТАЧ) -->
            <g id="activeStrokesLayer"></g>

            <!-- 5. ШАР ВИДІЛЕННЯ ТА ТРАНСФОРМАЦІЇ -->
            <g id="selectionLayer"></g>
          </g>
        </svg>

        <!-- ЕКРАННІ ПЛАВАЮЧІ ІНСТРУМЕНТИ (ЛІНІЙКА, ТРАНСПОТРТИР, ЦИРКУЛЬ) -->
        <div id="screenInstrumentsOverlay" class="screen-instruments-overlay">
          <!-- Інструменти рендеряться динамічно в instruments.js -->
        </div>

        <!-- ПЛАВАЮЧІ ВІДЖЕТИ МАСШТАБУВАННЯ ПОЛОТНА -->
        <div class="canvas-zoom-hud" id="canvasZoomHud">
          <button id="btnZoomOut" class="hud-btn" title="Зменшити">−</button>
          <span id="hudZoomValue" class="hud-value" title="Скинути масштаб до 100%">100%</span>
          <button id="btnZoomIn" class="hud-btn" title="Збільшити">+</button>
          <button id="btnFitScreen" class="hud-btn" title="По центру / скинути огляд">⛶</button>
        </div>

        <!-- ПОВНОЕКРАННИЙ FAB (Floating Action Button) -->
        <button id="fabFullscreen" class="fab-fullscreen-btn" title="Повноекранний режим (F11)">
          <svg viewBox="0 0 24 24" id="fabIconExpand"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          <svg viewBox="0 0 24 24" id="fabIconCompress" style="display:none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-14v3h3v2h-5V5h2z"/></svg>
        </button>
      </main>

      <!-- ПРАВА ПАНЕЛЬ ПРЕДМЕТНИХ МОДУЛІВ -->
      <aside class="sidebar-right" id="rightSidebar">
        <div class="sidebar-header">
          <h2 class="sidebar-title" id="subjectPanelTitle">🎒 Предметний Модуль</h2>
          <button id="btnCloseRightSidebar" class="btn-icon-sm" title="Згорнути панель">✖</button>
        </div>

        <div class="sidebar-content" id="subjectPanelContent">
          <!-- Вміст модулів динамічно завантажується з src/modules/* -->
        </div>
      </aside>

    </div>
  </div>

  <!-- Модальні вікна (для детальної інформації про елементи, формули тощо) -->
  <div class="modal-backdrop" id="appModalBackdrop" style="display:none;">
    <div class="modal-dialog" id="appModalDialog">
      <div class="modal-header">
        <h3 id="modalTitle">Заголовок</h3>
        <button id="btnModalClose" class="btn-icon-sm">✖</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- ГОЛОВНИЙ МОДУЛЬ JS -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
